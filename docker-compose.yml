services:
  # Servicio de la Base de Datos PostgreSQL
  postgres_db:
    image: postgres:15
    container_name: dentariasys-db
    restart: always
    environment:
      POSTGRES_DB: dentariasys_db
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: SeguridadAnteTodo55
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data

  # Servicio de pgAdmin para gestionar la BD
  pgadmin:
    image: dpage/pgadmin4
    container_name: dentariasys-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dentariasys.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_db

volumes:
  postgres-data: